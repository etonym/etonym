name: Report a problem
description: Something in Etonym does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Etonym sends nothing on its own: what you write here is all we see.
        This page is public, so leave out anything private from your notes.
  - type: input
    id: version
    attributes:
      label: Etonym version
      description: Settings → About shows it. "Report a problem" in the app fills it in.
      placeholder: "0.12.1"
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Edition
      description: "`github` (installed from the download page) or `store` (Microsoft Store)."
      placeholder: github
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 (10.0.26200)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line. A small sample note helps if it is not private.
      placeholder: |
        1. Open a folder with ...
        2. Type ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages as shown, or a screenshot without private content.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: |
        Settings → About → Log folder opens the folder with the log file.
        The log can name your notes and folders. Before you paste it, replace note titles, paths and anything private with `...`.
      render: text
